[project]
name = "htb-runtime"
version = "0.1.0"
description = "Runtime for website action cards: executor, registry and MCP gateway"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14,<3",
    "httpx>=0.28,<0.29",
    "jsonpath-ng>=1.16,<2",
    "mcp==2.3.0",
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "python-dotenv>=1.2",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schema", "runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
