[project]
name = "spider"
version = "0.1.0"
description = "Website action cards: mapper (capture to card), executor, registry and MCP gateway"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14,<3",
    "httpx>=0.28,<0.29",
    "jsonpath-ng>=1.16,<2",
    "mcp==2.3.0",
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "python-dotenv>=1.2",
    "curl-cffi>=0.17,<0.18",
    "cryptography>=46",
    "websockets>=15",
    # browser tier, login and mapper capture
    "playwright==1.64.1",
    "selectolax==0.3.30",
]

[project.optional-dependencies]
# Mapper LLM steps are optional: without ANTHROPIC_API_KEY the pipeline uses deterministic fallbacks.
llm = ["anthropic==2.6.0"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "pytest-xdist>=3.8.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spider"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Tests run in parallel (pytest-xdist): about 80 s instead of 5 min. Use -n0 to run in one process.
addopts = "-n auto --dist loadgroup"  # tests marked xdist_group("docker") share one worker
asyncio_default_fixture_loop_scope = "function"
# src/ for the spider package; harmap's tests import their helpers (fixture_site, synthetic) by bare name
pythonpath = ["src", "tests/mappers/harmap"]
markers = [
    "browser: needs a Playwright Chromium install (skipped when unavailable)",
]

[tool.ruff]
line-length = 110
src = ["src", "."]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM105"]  # try/except/pass is kept as written

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F811"]  # pytest fixtures used as parameters
# HTML, CSS, JS and SQL templates keep their long lines; wrapping them would change the page source
"src/spider/web/design.py" = ["E501"]
"src/spider/web/pages/account.py" = ["E501"]
"src/spider/web/pages/signin.py" = ["E501"]
"src/spider/signin/neko/manager.py" = ["E501"]
"src/spider/store/sessions.py" = ["E501"]
"src/spider/store/jobs.py" = ["E501"]
"tests/sites/fixture_site/app.py" = ["E501"]
